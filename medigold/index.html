<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Medigold</title>
  <style>
    :root{color-scheme:light dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f4f8;color:#2d1834;padding:24px}
    main{width:min(520px,100%);background:#fff;color:#2d1834;border:1px solid #e8dce9;border-radius:20px;padding:32px;text-align:center;box-shadow:0 16px 50px rgba(53,24,60,.08)}
    .mark{width:54px;height:54px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,#4b1859,#8c5a93);display:grid;place-items:center;color:#d7b56d;font-weight:800;font-size:24px}
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0;color:#6e5a73;line-height:1.5}
  </style>
  <script src="./config.js"></script>
  <script>
    (function(){
      const target = (window.MEDIGOLD_TARGET || "").trim();
      if (target) location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <div class="mark">M</div>
    <h1>Medigold</h1>
    <p>Información en preparación.</p>
  </main>
</body>
</html>
